# Custom OLED screen on the left
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Fetch the right battery
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Portrait screen is supplied by the local lily58_portrait shield
# Set to y if the display is upside down
CONFIG_LILY58_PORTRAIT_FLIP=n

# Blank the OLED after 30 seconds
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Deep sleep after 15 minutes
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Disable manual soft off
CONFIG_ZMK_PM_SOFT_OFF=n